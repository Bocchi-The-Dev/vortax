name: Vortax

on:
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: "Minutes before the runner times out (1-360)"
        type: string
        default: "15"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      TAILSCALE_HOSTNAME: gh-vortax-${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Install apt deps
        run: |
          sudo add-apt-repository -y multiverse
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip pipx curl jq \
            qemu-system-x86 qemu-utils qemu-system-arm \
            ovmf aria2 \
            p7zip-full unrar zstd \
            websockify novnc rclone
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update
          sudo apt-get install -y ngrok

      - name: Install bore
        run: |
          URL=$(curl -fsSL https://api.github.com/repos/ekzhang/bore/releases/latest \
            | jq -r '.assets[] | select(.name | test("x86_64-unknown-linux-musl.tar.gz$")) | .browser_download_url')
          curl -fsSL "$URL" | sudo tar -xz -C /usr/local/bin bore
          bore --version

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          sudo tailscale up \
            --authkey "${TAILSCALE_AUTHKEY}" \
            --hostname "${TAILSCALE_HOSTNAME}" \
            --ssh

      - name: Install Vortax
        run: pipx install .

      - name: Vortax doctor
        run: vortax doctor

      - name: Run Vortax
        run: |
          TS_IP=$(tailscale ip -4)
          nohup vortax dashboard --host "${TS_IP}" --port 8765 > /tmp/vortax.log 2>&1 &
          for i in $(seq 1 30); do
            grep -q '^open:' /tmp/vortax.log && break
            sleep 1
          done
          cat /tmp/vortax.log

      - name: Connection info + keep alive
        run: |
          TS_IP=$(tailscale ip -4)
          DASH_URL=$(grep -m1 '^open:' /tmp/vortax.log | sed 's/^open: //')

          echo "=== CONNECTION INFO ==="
          echo "Tailscale IP:  ${TS_IP}"
          echo "Hostname:      ${TAILSCALE_HOSTNAME}"
          echo "SSH:           ssh runner@${TS_IP}"
          echo "Dashboard:     ${DASH_URL}"
          while true; do sleep 600; done
